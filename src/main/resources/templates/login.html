<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Logowanie')}"></head>
<body class="auth-page">
<main class="auth-wrap">
    <a class="brand brand-lg" th:href="@{/}">
        <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5a1.5 1.5 0 0 0 0 3H20v0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 4.5v15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>BookList</span>
    </a>

    <section class="card auth-card">
        <h1>Zaloguj się</h1>
        <p class="muted">Twoja kolekcja książek i lista życzeń w jednym miejscu.</p>

        <div th:if="${param.error}" class="alert alert-error" role="alert">Nieprawidłowa nazwa użytkownika lub hasło.</div>
        <div th:if="${param.locked}" class="alert alert-error" role="alert">Za dużo nieudanych prób logowania. Spróbuj ponownie za 15 minut.</div>
        <div th:if="${param.logout}" class="alert alert-success" role="status">Wylogowano. Do zobaczenia!</div>
        <div th:if="${message}" class="alert alert-success" role="status" th:text="${message}">Konto utworzone</div>

        <form th:action="@{/login}" method="post" class="form">
            <div class="field">
                <label for="username">Nazwa użytkownika</label>
                <input type="text" id="username" name="username" required autofocus autocomplete="username">
            </div>
            <div class="field">
                <label for="password">Hasło</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <label class="checkbox">
                <input type="checkbox" name="remember-me" checked>
                <span>Nie wylogowuj mnie na tym urządzeniu</span>
            </label>
            <button type="submit" class="btn btn-primary btn-block">Zaloguj się</button>
        </form>

        <p class="auth-switch" th:if="${registrationEnabled}">
            Nie masz konta? <a th:href="@{/register}">Załóż konto</a>
        </p>
    </section>
</main>
</body>
</html>
