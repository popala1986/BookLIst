<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Zmień hasło')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container page">
    <a class="back-link" th:href="@{/}">← Wróć do biblioteki</a>

    <section class="card narrow">
        <h1>Zmień hasło</h1>
        <p class="muted">Po zmianie inne urządzenia, na których było zaznaczone „Nie wylogowuj mnie”, poproszą o nowe hasło.</p>

        <form th:action="@{/account/password}" th:object="${form}" method="post" class="form" novalidate>
            <div class="field" th:classappend="${#fields.hasErrors('currentPassword')} ? 'has-error'">
                <label for="currentPassword">Obecne hasło</label>
                <input type="password" id="currentPassword" th:field="*{currentPassword}" required autofocus autocomplete="current-password">
                <p class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}">Błąd</p>
            </div>
            <div class="field" th:classappend="${#fields.hasErrors('newPassword')} ? 'has-error'">
                <label for="newPassword">Nowe hasło</label>
                <input type="password" id="newPassword" th:field="*{newPassword}" required autocomplete="new-password" minlength="8">
                <p class="field-hint">Co najmniej 8 znaków.</p>
                <p class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}">Błąd</p>
            </div>
            <div class="field" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'has-error'">
                <label for="confirmPassword">Powtórz nowe hasło</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required autocomplete="new-password">
                <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Błąd</p>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Zmień hasło</button>
                <a class="btn btn-ghost" th:href="@{/}">Anuluj</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
