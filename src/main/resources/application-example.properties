# ===============================
# =  BookList Application
# ===============================

spring.application.name=BookList


# ===============================
# =  MySQL Database Configuration
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/book_list?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# =  JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# =  Accounts
# ===============================

# Accounts are added by the administrator in /admin. Set to true to let anyone create an account.
app.registration.enabled=false

# The single administrator account. Created at startup with this password if it does not exist yet.
app.admin.username=admin
app.admin.password=change-me

# Optional Google Books API key for automatic covers
app.google-books.api-key=

# ===============================
# =  Server Configuration
# ===============================

server.port=8080

