# Production profile (SPRING_PROFILES_ACTIVE=prod).
# All secrets come from environment variables, see .env.example and DEPLOY.md.
spring.application.name=BookList

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.registration.enabled=${APP_REGISTRATION_ENABLED:true}
app.admin.username=${APP_ADMIN_USERNAME}
app.admin.password=${APP_ADMIN_PASSWORD:}
# Secret for "remember me" cookies; keeps users logged in across restarts.
app.remember-me-key=${APP_REMEMBER_ME_KEY}

# Google Books API key (optional, but without it Google often refuses requests).
app.google-books.api-key=${GOOGLE_BOOKS_API_KEY:}

# Running behind Caddy: trust X-Forwarded-* headers so redirects use https and the real domain.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
