# Production profile (SPRING_PROFILES_ACTIVE=prod).
# All secrets come from environment variables, see .env.example and DEPLOY.md.
spring.application.name=BookList

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.admin.username=${APP_ADMIN_USERNAME}
app.admin.password=${APP_ADMIN_PASSWORD}

# Running behind Caddy: trust X-Forwarded-* headers so redirects use https and the real domain.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
